services:
  - type: pserv
    name: carrertrack-mysql-jahnavi
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: database/Dockerfile
    dockerContext: database
    disk:
      name: careertrack-mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_DATABASE
        value: careertrack_db
      - key: MYSQL_USER
        value: careertrack_user
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true

  - type: web
    name: carrertrack-api-jahnavi
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT run:app
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DB_HOST
        fromService:
          type: pserv
          name: carrertrack-mysql-jahnavi
          property: host
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        value: careertrack_user
      - key: DB_PASSWORD
        fromService:
          type: pserv
          name: carrertrack-mysql-jahnavi
          envVarKey: MYSQL_PASSWORD
      - key: DB_NAME
        value: careertrack_db
      - key: FRONTEND_URL
        value: https://carrertrack-web-jahnavi.onrender.com
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: Lax

  - type: web
    name: carrertrack-web-jahnavi
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://carrertrack-api-jahnavi.onrender.com/api